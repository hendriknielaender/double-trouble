version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
